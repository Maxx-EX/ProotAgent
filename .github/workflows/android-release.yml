name: Android Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Accept SDK licenses & install packages (NDK, CMake)
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          
          # 连续喂 y 接受所有协议
          printf 'y\n%.0s' $(seq 1 200) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 安装必要的 SDK, NDK, CMake 组件
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

          echo "----- installed ndk -----"
          ls "$ANDROID_HOME/ndk"
          echo "----- installed cmake -----"
          ls "$ANDROID_HOME/cmake"

      - name: Download Proot from Termux Official
        run: |
          # 使用更新后的官方最新版本号
          wget -q https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.92_aarch64.deb
          wget -q https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb
          
          # 解包
          dpkg-deb -x proot_5.1.107.92_aarch64.deb proot_extract
          dpkg-deb -x libtalloc_2.5.0_aarch64.deb talloc_extract
          
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # 提取 proot 主程序
          cp proot_extract/data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
          
          # 提取 talloc 依赖库
          cp talloc_extract/data/data/com.termux/files/usr/lib/libtalloc.so.2 app/src/main/jniLibs/arm64-v8a/libtalloc.so
          
          # 提取 proot loader（部分版本必须依赖）
          if [ -f proot_extract/data/data/com.termux/files/usr/libexec/proot/loader ]; then
            cp proot_extract/data/data/com.termux/files/usr/libexec/proot/loader app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          fi
          
          # 确保权限正确
          chmod 755 app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libtalloc.so
          [ -f app/src/main/jniLibs/arm64-v8a/libproot_loader.so ] && chmod 755 app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          
      - name: Materialize keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::签名四项 Secret 不完整"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VN="1.0.0"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VN="${GITHUB_REF#refs/tags/v}"
          else
            VN="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:assembleRelease \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PversionName=${{ steps.ver.outputs.version_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProotAgent-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
